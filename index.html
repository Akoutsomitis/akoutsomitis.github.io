<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alex's art studio</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Space+Mono:wght@400;700&family=Bungee&display=swap" rel="stylesheet">
<style>
  :root{
    --lav-deep: #8b6fdb;
    --cream: #fff6fa;
    --ink: #3a2b4a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Baloo 2', sans-serif;
    background: repeating-linear-gradient(45deg, #f3e6ff, #f3e6ff 10px, #ffeaf6 10px, #ffeaf6 20px);
    color:var(--ink);
  }
  .page{
    max-width:1200px;
    margin:24px auto;
    background:var(--cream);
    border:3px solid var(--ink);
    border-radius:18px;
    overflow:hidden;
    box-shadow: 10px 10px 0 rgba(139,111,219,0.35);
  }

  /* ===== header / nav ===== */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 30px; gap:20px; flex-wrap:wrap;
    border-bottom:3px dashed var(--lav-deep);
  }
  .logo{
    display:flex; align-items:center;
    perspective:900px;
  }
  .logo-spin{
    transform-style: preserve-3d;
  }
  .logo-img{
    height:100px; width:auto; display:block;
    animation: logo-turn 8s linear infinite;
    backface-visibility: visible;
    transform-style: preserve-3d;
  }
  @keyframes logo-turn{
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  nav{display:flex; gap:26px; align-items:center; flex-wrap:wrap;}
  nav a{
    color:var(--ink); text-decoration:none; font-weight:700; font-size:14px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav a .ic{font-size:20px;}

  :root{
    --lp-pink:#ff2f92;
    --lp-pink-hot:#ee5cbf;
    --lp-pink-dark:#b83a92;
    --lp-teal:#47e0c9;
    --lp-deep:#210533;
    --lp-cream:#fdf6ee;
    --lp-ink:#161018;
    --lp-grass:#7ed957;
    --lp-sky:#5fd0e8;
    --lp-sun:#ffce45;
    --lp-orange:#ff8a3d;
    --lp-violet:#8c6bff;
  }

  .lp-ocean{
    position:absolute; inset:0;
    z-index:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,179,222,0.55), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(71,224,201,0.45), transparent 50%),
      radial-gradient(circle at 75% 80%, rgba(180,140,255,0.5), transparent 50%),
      radial-gradient(circle at 25% 85%, rgba(255,47,146,0.45), transparent 50%),
      linear-gradient(135deg, #ff8fce, #b48cff 35%, #47e0c9 65%, #ff2f92 100%);
    background-size:180% 180%, 180% 180%, 180% 180%, 180% 180%, 300% 300%;
    animation: lp-swell 22s ease-in-out infinite alternate;
  }
  .lp-ocean::after{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.10) 0 2px, transparent 2px 40px),
      repeating-linear-gradient(25deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 55px);
    mix-blend-mode:screen;
    animation: lp-shimmer 14s linear infinite;
  }
  @keyframes lp-swell{
    0%{background-position:0% 0%, 100% 0%, 0% 100%, 100% 100%, 0% 0%;}
    100%{background-position:30% 20%, 70% 30%, 30% 80%, 70% 70%, 100% 100%;}
  }
  @keyframes lp-shimmer{
    0%{transform:translate(0,0);}
    100%{transform:translate(-60px,40px);}
  }

  .lp-sparkles{position:absolute; inset:0; z-index:1; pointer-events:none;}
  .lp-sparkle{
    position:absolute; border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px 2px rgba(255,255,255,0.8);
    animation: lp-twinkle 3s ease-in-out infinite;
  }
  @keyframes lp-twinkle{
    0%,100%{opacity:0.15; transform:scale(0.7);}
    50%{opacity:1; transform:scale(1.15);}
  }

  .lp-scene{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px;
    padding:50px 20px 40px;
    text-align:center;
    transition: opacity .5s ease, transform .6s ease;
  }
  .lp-rig{
    position:relative;
    z-index:2;
    width:380px;
    max-width:88vw;
    margin:0 auto;
    filter:drop-shadow(14px 18px 0 rgba(22,16,24,0.28));
  }

  .lp-monitor-block{ position:relative; width:78%; margin:0 auto; }

  .lp-monitor{
    position:relative;
    width:100%;
    aspect-ratio:0.92/1;
    background:linear-gradient(155deg, #ff8fd4, var(--lp-pink-hot) 55%, var(--lp-pink-dark));
    border:6px solid var(--lp-ink);
    border-radius:26px;
    padding:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden;
    z-index:2;
  }
  .lp-monitor::before{
    content:"";
    position:absolute;
    top:-25%; left:6%;
    width:14%; height:150%;
    background:rgba(255,255,255,0.5);
    transform:rotate(20deg);
    border-radius:20px;
  }
  .lp-monitor::after{
    content:"";
    position:absolute;
    top:-25%; left:24%;
    width:6%; height:150%;
    background:rgba(255,255,255,0.3);
    transform:rotate(20deg);
    border-radius:20px;
  }

  .lp-screen{
    position:relative;
    width:100%; height:78%;
    border-radius:14px;
    border:6px solid var(--lp-ink);
    overflow:hidden;
    background:linear-gradient(165deg, var(--lp-grass), var(--lp-sky) 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:9px;
    z-index:2;
    padding:10px;
  }

  .lp-nav-btn{
    font-family:'Bungee', cursive;
    font-size:clamp(13px, 3.9vw, 16px);
    color:var(--lp-ink);
    letter-spacing:0.04em;
    background:var(--lp-cream);
    border:4px solid var(--lp-ink);
    border-radius:12px;
    padding:11px 10px;
    text-align:center;
    width:88%;
    max-width:210px;
    box-shadow:4px 4px 0 var(--lp-ink);
    transform:translate(0,0);
    transition:transform .12s ease, box-shadow .12s ease;
    cursor:pointer;
    z-index:2;
    outline-offset:3px;
  }
  .lp-nav-btn:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--lp-ink); }
  .lp-nav-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--lp-ink); }
  .lp-nav-btn:focus-visible{ outline:3px solid var(--lp-ink); }

  .lp-nav-wrap{
    display:flex; flex-direction:column; align-items:center; gap:9px;
    width:100%;
  }

  .lp-console-strip{
    width:100%; height:14%;
    margin-top:8px;
    background:var(--lp-cream);
    border:5px solid var(--lp-ink);
    border-radius:10px;
    display:flex; align-items:center; gap:6px;
    padding:0 10px;
    z-index:2;
  }
  .lp-console-strip .lp-dot{ width:10px; height:10px; border:3px solid var(--lp-ink); border-radius:50%; }
  .lp-console-strip .lp-dot.lp-o{ background:var(--lp-orange); }
  .lp-console-strip .lp-dot.lp-g{ background:var(--lp-grass); }
  .lp-console-strip .lp-dot.lp-y{ background:var(--lp-sun); }
  .lp-console-strip .lp-bar{ flex:1; height:6px; background:var(--lp-violet); border:2px solid var(--lp-ink); border-radius:4px; }

  .lp-desk-row{
    position:relative;
    margin-top:34px;
    display:flex; align-items:flex-start; justify-content:center; gap:18px;
  }

  .lp-kb-block{ position:relative; width:60%; }
  .lp-keyboard{
    position:relative;
    width:100%;
    padding:9px;
    background:linear-gradient(155deg, #ff8fd4, var(--lp-pink-hot));
    border:6px solid var(--lp-ink);
    border-radius:12px;
    display:grid;
    grid-template-columns:repeat(9, 1fr);
    gap:4px;
    z-index:2;
  }
  .lp-key{
    height:13px;
    border:3px solid var(--lp-ink);
    border-radius:4px;
    background:var(--lp-sky);
  }
  .lp-key:nth-child(4n+1){ background:var(--lp-grass); }
  .lp-key:nth-child(4n+2){ background:var(--lp-violet); }
  .lp-key:nth-child(4n+3){ background:var(--lp-sun); }
  .lp-key.lp-wide{ grid-column:span 3; background:var(--lp-cream); }

  .lp-mouse-wrap{
    position:absolute;
    right:-58px;
    bottom:0;
    width:56px; height:78px;
    filter:drop-shadow(6px 8px 0 rgba(22,16,24,0.25));
  }
  .lp-mouse{
    position:relative;
    width:48px; height:66px;
    background:var(--lp-sun);
    border:5px solid var(--lp-ink);
    border-radius:50% 50% 42% 42%/58% 58% 38% 38%;
    overflow:hidden;
    z-index:2;
  }
  .lp-mouse::before{
    content:"";
    position:absolute; left:0; top:32%;
    width:100%; height:6px;
    background:var(--lp-ink);
  }
  .lp-mouse::after{
    content:"";
    position:absolute; left:0; top:0;
    width:48%; height:32%;
    background:var(--lp-orange);
  }
  .lp-mouse-soft-shadow{
    position:absolute;
    bottom:-8px; left:50%;
    width:72%; height:12px;
    background:rgba(22,16,24,0.22);
    border-radius:50%;
    filter:blur(4px);
    transform:translateX(-50%);
    z-index:0;
  }
  .lp-cable{ position:absolute; top:-54px; left:-76px; width:108px; height:68px; overflow:visible; z-index:1;}
  .lp-kb-cable{ position:absolute; top:-44px; left:40%; width:60px; height:56px; overflow:visible; z-index:1;}

  .lp-decor{
    position:absolute; inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .lp-float-item{
    position:absolute;
    width:var(--size, 40px);
    height:var(--size, 40px);
    animation: lp-floaty var(--dur, 3s) ease-in-out infinite;
    animation-delay:var(--delay, 0s);
  }
  .lp-float-item svg{ width:100%; height:100%; display:block; filter:drop-shadow(2px 3px 0 rgba(22,16,24,0.15)); }
  @keyframes lp-floaty{
    0%,100%{ transform:translateY(0) rotate(var(--rot, 0deg)); }
    50%{ transform:translateY(var(--rise, -16px)) rotate(var(--rot, 0deg)); }
  }

  .lp-portal-layer{
    position:absolute; inset:0; z-index:5;
    opacity:0; pointer-events:none;
    transition: opacity .7s ease;
    background:var(--lp-deep);
    overflow:hidden;
  }
  body.lp-entered .lp-portal-layer{ opacity:1; pointer-events:auto; }
  body.lp-entered .lp-scene{ opacity:0; transform:scale(0.85); pointer-events:none; }

  #lpHeartTunnel{
    position:absolute; inset:0;
    overflow:hidden;
  }
  .lp-heart-el{
    position:absolute;
    left:50%; top:50%;
    width:70vmax; height:70vmax;
    transform:translate(-50%,-50%) scale(0.05);
    opacity:0;
    will-change:transform, opacity;
  }
  .lp-heart-el svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35)); }

  .lp-portal-content{
    position:absolute;
    inset:0;
    display:flex; flex-direction:column; align-items:center;
    overflow-y:auto;
    z-index:2;
    color:var(--lp-cream);
    text-align:center;
    opacity:0;
    transition:opacity .8s ease 1s;
    padding:24px 20px 40px;
    pointer-events:none;
  }
  body.lp-entered .lp-portal-content{ opacity:1; pointer-events:auto; }
  body.lp-entered #lpHeartTunnel{ opacity:0; visibility:hidden; }
  #lpHeartTunnel{ transition:opacity .8s ease 1s, visibility 0s linear 1.8s; }

  .lp-section{ margin:auto; width:100%; max-width:1020px; }
  .lp-section[hidden]{ display:none; }

  .lp-portal-content h1{
    font-family:'Bungee', cursive;
    font-size:clamp(30px, 7vw, 56px);
    margin:0;
    text-shadow:0 0 20px var(--lp-pink), 0 0 50px var(--lp-pink);
  }
  .lp-gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:20px;
    width:100%;
    margin-top:22px;
  }
  .lp-art{
    margin:0;
    background:var(--lp-cream);
    border:4px solid var(--lp-ink);
    border-radius:12px;
    padding:10px 10px 16px;
    box-shadow:6px 6px 0 rgba(0,0,0,0.35);
    transform:rotate(-1.5deg);
    transition:transform .15s ease;
  }
  .lp-art:nth-child(even){ transform:rotate(1.5deg); }
  .lp-art:hover{ transform:rotate(0deg) scale(1.03); }
  .lp-art img{
    width:100%; height:280px; object-fit:cover; display:block;
    border:3px solid var(--lp-ink); border-radius:6px;
    background:#fff;
  }
  .lp-close{
    position:absolute; top:16px; right:16px; z-index:3;
    width:42px; height:42px; border-radius:50%;
    font-family:'Space Mono', monospace; font-size:16px; font-weight:700;
    color:var(--lp-deep); background:var(--lp-cream);
    border:3px solid var(--lp-ink);
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,0.35);
    opacity:0; pointer-events:none;
    transition:opacity .8s ease 1s;
  }
  body.lp-entered .lp-close{ opacity:1; pointer-events:auto; }
  .lp-close:focus-visible{ outline:3px solid var(--lp-teal); }

  .lp-art-link{ display:block; cursor:zoom-in; }
  .lp-lightbox{
    position:fixed; inset:0; z-index:50;
    background:rgba(22,16,24,0.88);
    display:flex; align-items:center; justify-content:center;
    padding:30px;
  }
  .lp-lightbox[hidden]{ display:none; }
  .lp-lightbox figure{
    margin:0; max-width:min(92vw, 1100px);
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .lp-lightbox img{
    max-width:100%; max-height:76vh; object-fit:contain;
    background:var(--lp-cream); padding:10px;
    border:5px solid var(--lp-ink); border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,0.55);
  }
  .lp-lightbox figcaption{
    font-family:'Bungee', cursive;
    font-size:16px; letter-spacing:0.06em;
    color:var(--lp-cream);
    text-shadow:0 0 14px var(--lp-pink);
  }
  .lp-lightbox-close{
    position:absolute; top:16px; right:16px;
    width:42px; height:42px; border-radius:50%;
    font-family:'Space Mono', monospace; font-size:16px; font-weight:700;
    color:var(--lp-deep); background:var(--lp-cream);
    border:3px solid var(--lp-ink);
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,0.35);
  }
  .lp-lightbox-close:focus-visible{ outline:3px solid var(--lp-teal); }

  @media (prefers-reduced-motion: reduce){
    .lp-ocean, .lp-ocean::after, .lp-sparkle, .lp-float-item{ animation:none !important; }
  }

  /* ===== mobile ===== */
  #lpWrap{ min-height:780px; }

  @media (max-width: 700px){
    .page{
      margin:10px;
      border-radius:14px;
      box-shadow:6px 6px 0 rgba(139,111,219,0.35);
    }
    header{ padding:10px 14px; gap:12px; }
    .logo-img{ height:64px; }
    nav{ gap:14px; }
    nav a{ font-size:13px; }
    nav a .ic{ font-size:18px; }
  }

  @media (max-width: 520px){
    header{ justify-content:center; }
    #lpWrap{ min-height:600px; }
    .lp-scene{ min-height:600px; padding:34px 14px 30px; gap:20px; }
    .lp-mouse-wrap{ right:4px; }
    .lp-cable{ left:-64px; width:96px; }
    .lp-portal-content{ padding:18px 14px 30px; }
    .lp-close{ top:12px; right:12px; }
    .lp-art img{ height:240px; }
    .lp-lightbox{ padding:16px; }
  }

</style>
</head>

      <div class="lp-desk-row">

            <div class="lp-key"></div><div class="lp-key"></div><div class="lp-key"></div>

  </main>

  <div class="lp-portal-layer">
    <div id="lpHeartTunnel"></div>
    <div class="lp-portal-content">
      <section class="lp-section" id="lpSectionArtwork" hidden>
        <h1 class="lp-section-title">artwork</h1>
        <div class="lp-gallery">
          <figure class="lp-art"><a class="lp-art-link" href="artwork/pomegranate.jpg" data-title="pomegranate"><img src="artwork/pomegranate.jpg" alt="Painting of a split pomegranate on a red and white striped cloth"></a></figure>
          <figure class="lp-art"><a class="lp-art-link" href="artwork/carrots.jpg" data-title="carrots"><img src="artwork/carrots.jpg" alt="Painting of a bunch of carrots with green tops on a wooden table"></a></figure>
          <figure class="lp-art"><a class="lp-art-link" href="artwork/bananas.jpg" data-title="bananas"><img src="artwork/bananas.jpg" alt="Banana print scarf and a framed banana painting hanging side by side"></a></figure>
          <figure class="lp-art"><a class="lp-art-link" href="artwork/ceramics-houses.jpg" data-title="ceramic houses"><img src="artwork/ceramics-houses.jpg" alt="Two carved ceramic dishes, one with a house pattern and one with blue leaves"></a></figure>
        </div>
      </section>
      <section class="lp-section" id="lpSectionAbout" hidden>
        <h1 class="lp-section-title">about me</h1>
      </section>
      <section class="lp-section" id="lpSectionContact" hidden>
        <h1 class="lp-section-title">contact</h1>
      </section>

    <button class="lp-close" id="lpCloseBtn" aria-label="back to the desktop">✕</button>
  </div>

  <div class="lp-lightbox" id="lpLightbox" hidden>
    <figure>
      <img id="lpLightboxImg" src="" alt="">
      <figcaption id="lpLightboxCap"></figcaption>
    </figure>
    <button class="lp-lightbox-close" id="lpLightboxClose" aria-label="close image">✕</button>
  </div>



</div>


</div>
<script>

  const sparkleField = document.getElementById('lpSparkles');
  for(let i=0;i<45;i++){
    const s = document.createElement('div');
    s.className='lp-sparkle';
    const size = Math.random()*3+1.5;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.animationDuration = (Math.random()*2+2.2)+'s';
    sparkleField.appendChild(s);
  }

  const heartPath = "M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5 C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3 C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z";
  const shades = [
    { light:'#ff9fd2', base:'#ff2f92', dark:'#a4165f' },
    { light:'#ffe0f0', base:'#ffb3de', dark:'#e078b8' },
    { light:'#dcc8ff', base:'#b48cff', dark:'#7248c9' },
    { light:'#b6f5ea', base:'#47e0c9', dark:'#1f9d89' }
  ];
  const svgNS = "http://www.w3.org/2000/svg";
  const tunnel = document.getElementById('lpHeartTunnel');

  const defsSvg = document.createElementNS(svgNS, "svg");
  defsSvg.setAttribute("width", "0");
  defsSvg.setAttribute("height", "0");
  defsSvg.style.position = "absolute";
  const defs = document.createElementNS(svgNS, "defs");
  shades.forEach((s, i) => {
    const grad = document.createElementNS(svgNS, "radialGradient");
    grad.setAttribute("id", "heartGrad" + i);
    grad.setAttribute("cx", "38%");
    grad.setAttribute("cy", "30%");
    grad.setAttribute("r", "75%");
    const stop1 = document.createElementNS(svgNS, "stop");
    stop1.setAttribute("offset", "0%");
    stop1.setAttribute("stop-color", s.light);
    const stop2 = document.createElementNS(svgNS, "stop");
    stop2.setAttribute("offset", "55%");
    stop2.setAttribute("stop-color", s.base);
    const stop3 = document.createElementNS(svgNS, "stop");
    stop3.setAttribute("offset", "100%");
    stop3.setAttribute("stop-color", s.dark);
    grad.appendChild(stop1); grad.appendChild(stop2); grad.appendChild(stop3);
    defs.appendChild(grad);
  });
  defsSvg.appendChild(defs);
  tunnel.appendChild(defsSvg);

  const HEART_COUNT = 12;
  const hearts = [];
  for(let i=0;i<HEART_COUNT;i++){
    const wrap = document.createElement('div');
    wrap.className = 'lp-heart-el';
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");

    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", heartPath);
    path.setAttribute("fill", `url(#heartGrad${i % shades.length})`);
    path.setAttribute("stroke", "#161018");
    path.setAttribute("stroke-width", "2");
    path.setAttribute("stroke-linejoin", "round");
    svg.appendChild(path);

    const shineBig = document.createElementNS(svgNS, "path");
    shineBig.setAttribute("d", "M7.5,6.2 C6,7.6 5.6,9.6 6.1,11.6");
    shineBig.setAttribute("stroke", "#ffffff");
    shineBig.setAttribute("stroke-width", "1.2");
    shineBig.setAttribute("stroke-linecap", "round");
    shineBig.setAttribute("fill", "none");
    shineBig.setAttribute("opacity", "0.9");
    svg.appendChild(shineBig);

    const shineSmall = document.createElementNS(svgNS, "path");
    shineSmall.setAttribute("d", "M9.6,5.8 C8.9,6.4 8.7,7.2 8.9,8");
    shineSmall.setAttribute("stroke", "#ffffff");
    shineSmall.setAttribute("stroke-width", "0.8");
    shineSmall.setAttribute("stroke-linecap", "round");
    shineSmall.setAttribute("fill", "none");
    shineSmall.setAttribute("opacity", "0.85");
    svg.appendChild(shineSmall);

    wrap.appendChild(svg);
    tunnel.appendChild(wrap);
    hearts.push({ el: wrap, progress: i / HEART_COUNT });
  }

  const CYCLE_MS = 2600;
  let lastTime = performance.now();
  let running = true;

  function frame(now){
    const dt = now - lastTime;
    lastTime = now;
    if(running){
      for(const h of hearts){
        h.progress += dt / CYCLE_MS;
        if(h.progress > 1) h.progress -= 1;
        const p = h.progress;
        const scale = 0.04 + Math.pow(p, 1.6) * 2.4;
        let opacity;
        if(p < 0.08) opacity = p / 0.08;
        else if(p > 0.75) opacity = Math.max(0, 1 - (p - 0.75) / 0.25);
        else opacity = 1;
        h.el.style.transform = `translate(-50%,-50%) scale(${scale})`;
        h.el.style.opacity = opacity;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion){
    running = false;
    hearts.forEach((h,i)=>{
      h.el.style.transform = `translate(-50%,-50%) scale(${0.4 + i*0.18})`;
      h.el.style.opacity = 1 - i/HEART_COUNT;
    });
  }

  const body = document.body;
  const sections = {
    artwork: document.getElementById('lpSectionArtwork'),
    about: document.getElementById('lpSectionAbout'),
    contact: document.getElementById('lpSectionContact')
  };

  document.querySelectorAll('[data-section]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const target = btn.dataset.section;
      Object.entries(sections).forEach(([name, el]) => { el.hidden = name !== target; });
      body.classList.add('lp-entered');
    });
  });

  const exitPortal = () => body.classList.remove('lp-entered');
  document.getElementById('lpCloseBtn').addEventListener('click', exitPortal);

  const lightbox = document.getElementById('lpLightbox');
  const lightboxImg = document.getElementById('lpLightboxImg');
  const lightboxCap = document.getElementById('lpLightboxCap');

  document.querySelectorAll('.lp-art-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const img = link.querySelector('img');
      lightboxImg.src = link.getAttribute('href');
      lightboxImg.alt = img.alt;
      lightboxCap.textContent = link.dataset.title || '';
      lightbox.hidden = false;
    });
  });

  const closeLightbox = () => { lightbox.hidden = true; };
  document.getElementById('lpLightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });

  document.getElementById('logoHome').addEventListener('click', (e) => {
    e.preventDefault();
    closeLightbox();
    exitPortal();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if(!lightbox.hidden) closeLightbox();
      else exitPortal();
    }
  });

</script>
</body>
